[global]
"Alt+h" = "window.left"
"Alt+j" = "window.down"
"Alt+k" = "window.up"
"Alt+l" = "window.right"
"Alt+-" = "window.split"
"Alt+\\" = "window.vsplit"
"Alt+Q" = "window.quit"
# Adroit has no zoom toggle, so the window is moved to a tab of its own instead.
"Alt+z" = "window.to_tab"

"Alt+r h" = "window.narrower"
"Alt+r l" = "window.wider"
"Alt+r j" = "window.taller"
"Alt+r k" = "window.shorter"
"Alt+ArrowLeft" = "window.narrower"
"Alt+ArrowRight" = "window.wider"
"Alt+ArrowDown" = "window.taller"
"Alt+ArrowUp" = "window.shorter"

"Alt+n" = "tab.next"
"Alt+N" = "tab.prev"
"Alt+1" = "tab.go 1"
"Alt+2" = "tab.go 2"
"Alt+3" = "tab.go 3"
"Alt+4" = "tab.go 4"
"Alt+5" = "tab.go 5"
"Alt+6" = "tab.go 6"
"Alt+7" = "tab.go 7"
"Alt+8" = "tab.go 8"
"Alt+9" = "tab.go 9"

"Alt+c" = "session.new"
"Alt+t" = "session.pick"
"Alt+w" = "waiting.next"
"Alt+W" = "session.pick"

"Alt+q" = "console.read"
"Alt+[" = "console.read"
